<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Analysis Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.24.2/plotly.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/numeric/1.2.6/numeric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Warehouse & Production Analysis Dashboard</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="production-hours">Production Hours/Day: <span id="production-hours-value" class="range-value"></span></label>
                <input type="range" id="production-hours" min="4.0" max="20.0" step="0.5" value="5.5">
            </div>
            
            <div class="control-group">
                <label for="production-days">Production Days/Week: <span id="production-days-value" class="range-value"></span></label>
                <input type="range" id="production-days" min="3.0" max="5.0" step="0.5" value="4.0">
            </div>
            
            <div class="control-group">
                <label for="avg-bundle-cost">Avg Bundle Revenue ($): <span id="avg-bundle-cost-value" class="range-value"></span></label>
                <input type="range" id="avg-bundle-cost" min="30.0" max="120.0" step="5.0" value="50.0">
            </div>

            <div class="control-group">
                <label>MIN Orders/Week: <span id="orders-min-value" class="range-value"></span></label>
                <input type="range" id="orders-min" min="5" max="50" step="5" value="10">
            </div>
            
            <div class="control-group">
                <label>MAX Orders/Week: <span id="orders-max-value" class="range-value"></span></label>
                <input type="range" id="orders-max" min="10" max="150" step="5" value="100">
            </div>

            <div class="control-group">
                <label for="avg-pallets-per-order">Avg Pallets/Order: <span id="avg-pallets-per-order-value" class="range-value"></span></label>
                <input type="range" id="avg-pallets-per-order" min="1.0" max="5.0" step="0.1" value="2.5">
            </div>

            <div class="control-group">
                <label for="product-dist-ratio">16OC Product Ratio: <span id="product-dist-ratio-value" class="range-value"></span></label>
                <input type="range" id="product-dist-ratio" min="0" max="1" step="0.05" value="0.85">
            </div>
        </div>
        
        <div class="chart-container">
            <div id="analysisChart"></div>
        </div>
        
        <div class="summary-container">
            <h2>Production Scenarios Summary</h2>
            <div id="summary-tables"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="calculations.js"></script>
    <script src="ui.js"></script>
</body>
</html>
